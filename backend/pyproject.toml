[project]
name = "reviewiq-backend"
version = "0.1.0"
description = "ReviewIQ — AI Code Review Assistant (backend API)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Runtime dependencies grow phase-by-phase. Phase 0 only needs the web layer
# so `uv sync` stays fast and each checkpoint is easy to verify. DB, Celery,
# Qdrant, GitHub and AI libraries are added in the phases that first use them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Phase 1 — data layer
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Phase 2 — auth (JWT + GitHub OAuth + token encryption)
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
]

# PEP 735 dependency groups (natively understood by uv). `dev` is installed
# locally but excluded from the production Docker image via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
# This is a deployable application, not a library we publish to PyPI, so we
# tell uv not to try to build/install `app` as a wheel. The `app` package is
# importable simply because commands run from the `backend/` working directory.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; don't lint generated migration scripts.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# A pragmatic, high-signal rule set: pyflakes (F), pycodestyle (E), isort (I),
# bugbear (B), pyupgrade (UP), comprehensions (C4), simplify (SIM).
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design;
# that's not the mutable-default footgun B008 targets.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
